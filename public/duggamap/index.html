<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PujoParikroma – Interactive Puja & Transit Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#1a0c0e; font-family: system-ui, -apple-system, sans-serif; color: #f8edd8; }
    .app-wrapper { display: flex !important; flex-direction: column !important; height: 100vh !important; width: 100vw !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; background: #1a0c0e !important; }

    /* Slim Top Bar - map only controls */
    .top-control-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #251215; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.12); z-index: 1000; flex-shrink: 0; }

    .search-row-slim { flex: 1; min-width: 140px; display: flex; align-items: center; gap: 6px; margin: 0; }
    .search-bar-slim { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0 8px; height: 32px; position: relative; }
    .search-bar-slim input { flex: 1; border: none; background: transparent; color: #fff; font-size: 12px; outline: none; padding-left: 4px; width: 100%; }
    .search-bar-slim input::placeholder { color: rgba(248,237,216,0.5); }
    .search-bar-slim svg { color: #f5c85b; flex-shrink: 0; }

    .quick-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .pill-btn-slim { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f8edd8; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .pill-btn-slim.active { background: #8c1e21; color: #f5c85b; border-color: #f5c85b; }
    .pill-btn-slim.metro-active { background: #2563eb !important; color: #fff !important; border-color: #60a5fa !important; }
    .pill-btn-slim.toilet-active { background: #0891b2 !important; color: #fff !important; border-color: #22d3ee !important; }

    /* Full-bleed Map */
    .map-panel { flex: 1 1 auto !important; position: relative !important; width: 100% !important; height: 100% !important; min-height: 0 !important; overflow: hidden; }
    #map-container-v2 { position: absolute !important; top: 0 !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0 !important; border: none !important; background: #1a0c0e !important; }

    /* Hide elements from style.css that we don't need */
    .gate-overlay, .gate-overlay.is-visible, #tab-nearest, .tab-bar-slim, .loc-switcher,
    .tab-panel, .nav-bottom, .dashboard-wrapper, .map-fab { display: none !important; }

    /* Sheet card for marker popups */
    .sheet-card { position: absolute; bottom: 0; left: 0; right: 0; background: #251215; border-top: 1px solid rgba(255,255,255,0.15); border-radius: 16px 16px 0 0; z-index: 1000; transform: translateY(100%); transition: transform 0.3s ease; max-height: 40vh; overflow-y: auto; }
    .sheet-card.is-open { transform: translateY(0); }
    .sheet-handle { display: block; width: 36px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 8px auto; border: none; cursor: pointer; }
    .sheet-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: #f8edd8; font-size: 18px; cursor: pointer; }
    .sheet-body { padding: 8px 16px 16px; }
  </style>
</head>
<body>

  <div class="app-wrapper" id="app">

    <!-- ===== SLIM TOP CONTROL BAR (Map filters only) ===== -->
    <div class="top-control-bar">
      <!-- Live Search Bar -->
      <div class="search-row-slim">
        <div class="search-bar-slim">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="search-input-map" placeholder="Search pandals, metro, toilets...">
          <button class="search-clear-btn" id="search-clear-map" title="Clear">✕</button>
          <div class="search-results" id="search-results-map"></div>
        </div>
      </div>

      <!-- Quick Filter Pills & Amenity Toggles -->
      <div class="quick-controls" id="category-boxes-map">
        <button class="pill-btn-slim active" data-cat="all">All</button>
        <button class="pill-btn-slim" data-cat="iconic">⭐ Iconic</button>
        <div class="dropdown" id="area-dropdown" style="display:inline-block;">
          <button class="pill-btn-slim dropdown-toggle" id="area-toggle-btn">Area ▾</button>
          <div class="dropdown-menu">
            <div class="dd-item" data-cat="south">South Kolkata</div>
            <div class="dd-item" data-cat="north">North Kolkata</div>
            <div class="dd-item" data-cat="bonedibari">Bonedi Bari</div>
            <div class="dd-item" data-cat="saltlake">Salt Lake</div>
          </div>
        </div>
        <button class="pill-btn-slim" id="metro-toggle-btn" title="Metro & Bus">🚇 Metro</button>
        <button class="pill-btn-slim" id="toilet-toggle-btn" title="Toilets">🚻 Toilet</button>
      </div>
    </div>

    <!-- ===== FULL-BLEED MAP ===== -->
    <div class="map-panel">
      <div id="map-container-v2"></div>

      <div class="sheet-card" id="sheet-card">
        <button class="sheet-handle" id="sheet-handle" title="Tap to collapse/expand"></button>
        <button class="sheet-close" id="sheet-close">✕</button>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

  </div>

  <div id="info-modal" class="custom-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title-content">Notification</h3>
        <button class="close-modal-btn" id="modal-close-x">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-text-content">Content placeholder.</p>
      </div>
      <div class="modal-footer">
        <button class="modal-ok-btn" id="modal-close-btn">Got it</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- Safe DOM Proxy to prevent missing elements from crashing app.js -->
  <script>
    (function() {
      const realGetElementById = document.getElementById.bind(document);
      function createDummyElement() {
        const dummy = {
          style: {},
          classList: { add: () => {}, remove: () => {}, toggle: () => {}, contains: () => false },
          dataset: {},
          addEventListener: () => {},
          removeEventListener: () => {},
          querySelector: () => null,
          querySelectorAll: () => [],
          appendChild: () => {},
          removeChild: () => {},
          setAttribute: () => {},
          removeAttribute: () => {},
          click: () => {},
          focus: () => {},
          blur: () => {},
          textContent: '',
          innerHTML: '',
          value: '',
        };
        return new Proxy(dummy, {
          get(target, prop) {
            if (prop in target) return target[prop];
            if (typeof prop === 'string' && prop.startsWith('on')) return null;
            return () => {};
          },
          set(target, prop, value) {
            target[prop] = value;
            return true;
          }
        });
      }
      const dummyStore = {};
      document.getElementById = function(id) {
        const el = realGetElementById(id);
        if (el) return el;
        if (!dummyStore[id]) {
          dummyStore[id] = createDummyElement();
        }
        return dummyStore[id];
      };
    })();

    // Stub functions called from init that reference removed panels
    window.renderNearestTab = function(){};
    window.renderDashboard = function(){};
    window.renderProfileList = function(){};
    window.toggleCollapsibleSection = window.toggleCollapsibleSection || function(){};
    window.animateCollapsible = window.animateCollapsible || function(){};
  </script>

  <script src="app.js"></script>

  <!-- Post-load: ensure map fills container properly -->
  <script>
    function triggerInvalidate() {
      if (typeof leafletMap !== 'undefined' && leafletMap) {
        leafletMap.invalidateSize();
      }
    }
    window.addEventListener('load', function() {
      setTimeout(triggerInvalidate, 100);
      setTimeout(triggerInvalidate, 500);
      setTimeout(triggerInvalidate, 1200);
    });
    const resizeObserver = new ResizeObserver(function() {
      triggerInvalidate();
    });
    resizeObserver.observe(document.body);
  </script>
</body>
</html>
